<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 背景の薄い丸形ベース（ファビコンとしての視認性向上） -->
  <rect width="64" height="64" rx="14" fill="#f8fafc" />

  <!-- アイソメトリック白サーバーラック -->
  <g transform="translate(0, 2)">
    <!-- 1. 左側面 (Left Face) -->
    <polygon
      points="12,24 32,34 32,54 12,44"
      fill="#edf2f7"
      stroke="#cbd5e1"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
    <!-- 左側面のスリット溝 -->
    <line x1="17" y1="30" x2="17" y2="44" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="22" y1="32.5" x2="22" y2="46.5" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="27" y1="35" x2="27" y2="49" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

    <!-- 2. 右正面 (Right Front Face - スロット面) -->
    <polygon
      points="32,34 52,24 52,44 32,54"
      fill="#ffffff"
      stroke="#cbd5e1"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
    <!-- スロットユニットとLED -->
    <!-- スロット1 -->
    <line x1="35" y1="37" x2="45" y2="32" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    <circle cx="48" cy="30.5" r="1.8" fill="#10b981" />

    <!-- スロット2 -->
    <line x1="35" y1="42" x2="45" y2="37" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    <circle cx="48" cy="35.5" r="1.8" fill="#10b981" />

    <!-- スロット3 -->
    <line x1="35" y1="47" x2="45" y2="42" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    <circle cx="48" cy="40.5" r="1.8" fill="#34d399" />

    <!-- 3. 天面 (Top Face - 菱形) -->
    <polygon
      points="32,14 52,24 32,34 12,24"
      fill="#ffffff"
      stroke="#94a3b8"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- 天面の薄緑アクセントバッジ -->
    <polygon
      points="32,20 42,25 32,30 22,25"
      fill="#ecfdf5"
      stroke="#a7f3d0"
      stroke-width="1"
    />
    <circle cx="32" cy="25" r="2.2" fill="#10b981" />
  </g>
</svg>
